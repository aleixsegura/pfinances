<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plout</title>
    <!-- Language must be set before first paint. -->
    <script>
      try {
        var lang = localStorage.getItem("language");
        document.documentElement.lang = lang === "ca" || lang === "es" ? lang : "en";
      } catch (e) {
        /* default lang="en" from the attribute above */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
